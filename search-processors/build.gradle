plugins {
    id 'java'
    id 'jacoco'
    id "io.freefair.lombok"
}

repositories {
    maven { url "https://ci.opensearch.org/maven2/" }
    mavenCentral()
    mavenLocal()
}


dependencies {
    implementation project(path: ":${rootProject.name}-common", configuration: 'shadow')
    compileOnly group: 'org.opensearch', name: 'opensearch', version: "${opensearch_version}"
    compileOnly group: 'com.google.code.gson', name: 'gson', version: '2.11.0'
    implementation 'org.apache.commons:commons-lang3:3.18.0'
    implementation project(':opensearch-ml-memory')
    implementation group: 'org.opensearch', name: 'common-utils', version: "${common_utils_version}"
    // https://mvnrepository.com/artifact/org.apache.httpcomponents.core5/httpcore5
    implementation group: 'org.apache.httpcomponents.core5', name: 'httpcore5', version: "5.2.2"
    implementation (group: 'com.google.guava', name: 'guava', version: '32.1.2-jre') {
	exclude group: 'com.google.errorprone', module: 'error_prone_annotations'
    }
    implementation group: 'org.json', name: 'json', version: '20231013'
    implementation group: 'org.apache.commons', name: 'commons-text', version: '1.10.0'
    testImplementation "org.opensearch.test:framework:${opensearch_version}"
}

test {
    include '**/*Tests.class'
    systemProperty 'tests.security.manager', 'false'
}

jacocoTestReport {
    dependsOn /*integTest,*/ test
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = 0.8
            }
            limit {
                counter = 'BRANCH'
                minimum = 0.8
            }
        }
    }
    dependsOn jacocoTestReport
}

check.dependsOn jacocoTestCoverageVerification

// Spotless 8.10.x (the pinned Eclipse-JDT toolchain) requires a Java 17+ runtime to even
// resolve/apply its Gradle plugin. Skip it on older JDKs (e.g. the Java 11 CI matrix) so
// non-spotless builds don't fail at configuration time. Formatting still runs on Java 17+.
if (JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_17)) {
    apply plugin: 'com.diffplug.spotless'

    // Only wire the Eclipse JDT step when a spotless task is actually being run.
    def runningSpotlessTask = gradle.startParameter.taskNames.any { it.toLowerCase(Locale.ROOT).contains('spotless') }

    spotless {
        java {
            removeUnusedImports()
            importOrder 'java', 'javax', 'org', 'com'

            // Pin 4.27 explicitly: spotless 8.10.0+ ships an embedded lockfile for it so the
            // formatter resolves from Maven Central instead of a P2 update site. 4.27 keeps
            // formatting identical to the eclipse() default of the previous spotless version.
            if (runningSpotlessTask) {
                eclipse('4.27').withP2Mirrors(Map.of("https://download.eclipse.org/", "https://ci.opensearch.org/")).configFile rootProject.file('.eclipseformat.xml')
            }
        }
    }
}
