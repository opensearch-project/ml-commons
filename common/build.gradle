//TODO: cleanup gradle config file, some overlap
plugins {
    id 'java'
    id 'com.gradleup.shadow'
    id 'jacoco'
    id "io.freefair.lombok"
    id 'maven-publish'
    id 'signing'
}

dependencies {
    compileOnly group: 'org.opensearch', name: 'opensearch', version: "${opensearch_version}"
    compileOnly group: 'org.reflections', name: 'reflections', version: '0.9.12'
    testImplementation group: 'junit', name: 'junit', version: '4.13.2'
    compileOnly "org.opensearch.client:opensearch-rest-client:${opensearch_version}"
    compileOnly "org.opensearch:common-utils:${common_utils_version}"
    testImplementation group: 'org.mockito', name: 'mockito-core', version: '5.7.0'
    testImplementation "org.opensearch.test:framework:${opensearch_version}"

    compileOnly group: 'org.apache.commons', name: 'commons-text', version: '1.10.0'
    compileOnly group: 'com.google.code.gson', name: 'gson', version: '2.11.0'
    compileOnly group: 'org.json', name: 'json', version: '20231013'
    testImplementation group: 'org.json', name: 'json', version: '20231013'
    implementation('com.google.guava:guava:32.1.3-jre') {
        exclude group: 'com.google.guava', module: 'failureaccess'
        exclude group: 'com.google.code.findbugs', module: 'jsr305'
        exclude group: 'org.checkerframework', module: 'checker-qual'
        exclude group: 'com.google.errorprone', module: 'error_prone_annotations'
        exclude group: 'com.google.j2objc', module: 'j2objc-annotations'
        exclude group: 'com.google.guava', module: 'listenablefuture'
    }
    compileOnly ('com.jayway.jsonpath:json-path:2.9.0') {
        exclude group: 'net.minidev', module: 'json-smart'
    }
    compileOnly ('net.minidev:json-smart:2.5.2')
    compileOnly("com.fasterxml.jackson.core:jackson-annotations:${versions.jackson}")
    compileOnly("com.fasterxml.jackson.core:jackson-databind:${versions.jackson_databind}")
    compileOnly group: 'com.networknt' , name: 'json-schema-validator', version: '1.4.0'
    // Multi-tenant SDK Client
    compileOnly "org.opensearch:opensearch-remote-metadata-sdk:${opensearch_build}"
    compileOnly (group: 'software.amazon.awssdk', name: 'netty-nio-client', version: "2.32.29") {
        exclude(group: 'org.reactivestreams', module: 'reactive-streams')
        exclude(group: 'org.slf4j', module: 'slf4j-api')
    }
}

lombok {
    version = "1.18.30"
}

jacocoTestReport {
    reports {
        xml.getRequired().set(true)
        csv.getRequired().set(false)
        html.getRequired().set(true)
    }

    dependsOn test
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = 0.8 //TODO: add more test to meet the coverage bar 0.9
            }
            limit {
                counter = 'BRANCH'
                minimum = 0.7 //TODO: add more test to meet the coverage bar 0.9
            }
        }
    }
    dependsOn jacocoTestReport
}
check.dependsOn jacocoTestCoverageVerification

// Spotless 8.10.x (the pinned Eclipse-JDT toolchain) requires a Java 17+ runtime to even
// resolve/apply its Gradle plugin. Skip it on older JDKs (e.g. the Java 11 CI matrix) so
// non-spotless builds don't fail at configuration time. Formatting still runs on Java 17+.
if (JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_17)) {
    apply plugin: 'com.diffplug.spotless'

    // Only wire the Eclipse JDT step when a spotless task is actually being run.
    def runningSpotlessTask = gradle.startParameter.taskNames.any { it.toLowerCase(Locale.ROOT).contains('spotless') }

    spotless {
        java {
            removeUnusedImports()
            importOrder 'java', 'javax', 'org', 'com'

            // Pin 4.29 explicitly: spotless 8.10.0+ ships an embedded lockfile for it so the
            // formatter resolves from Maven Central instead of a P2 update site. 4.29 keeps
            // formatting identical to the eclipse() default of the previous spotless version.
            if (runningSpotlessTask) {
                eclipse('4.29').withP2Mirrors(Map.of("https://download.eclipse.org/", "https://ci.opensearch.org/")).configFile rootProject.file('.eclipseformat.xml')
            }
        }
    }
}

tasks.named('shadowJar') {
    destinationDirectory = file("${project.buildDir}/distributions")
    archiveClassifier.set(null)
    exclude 'META-INF/maven/com.google.guava/**'
    exclude 'com/google/thirdparty/**'
    relocate 'com.google.common', 'org.opensearch.ml.repackage.com.google.common'
}

jar {
    enabled false
}

task sourcesJar(type: Jar) {
    archiveClassifier.set 'sources'
    from sourceSets.main.allJava
}

task javadocJar(type: Jar) {
    archiveClassifier.set 'javadoc'
    from javadoc.destinationDir
    dependsOn javadoc
}

publishing {
    repositories {
        maven {
            name = 'staging'
            url = "${rootProject.buildDir}/local-staging-repo"
        }
        maven {
            name = "Snapshots" //  optional target repository name
            url = System.getenv("MAVEN_SNAPSHOTS_S3_REPO")
            credentials(AwsCredentials) {
                accessKey = System.getenv("AWS_ACCESS_KEY_ID")
                secretKey = System.getenv("AWS_SECRET_ACCESS_KEY")
                sessionToken = System.getenv("AWS_SESSION_TOKEN")
            }
        }
    }
    publications {
        shadow(MavenPublication) { publication ->
            project.shadow.component(publication)
            artifact sourcesJar
            artifact javadocJar

            pom {
                name = "OpenSearch ML Commons Comm"
                packaging = "jar"
                url = "https://github.com/opensearch-project/ml-commons"
                description = "OpenSearch ML Common"
                scm {
                    connection = "scm:git@github.com:opensearch-project/ml-commons.git"
                    developerConnection = "scm:git@github.com:opensearch-project/ml-commons.git"
                    url = "git@github.com:opensearch-project/ml-commons.git"
                }
                licenses {
                    license {
                        name = "The Apache License, Version 2.0"
                        url = "http://www.apache.org/licenses/LICENSE-2.0.txt"
                    }
                }
                developers {
                    developer {
                        name = "OpenSearch"
                        url = "https://github.com/opensearch-project/ml-commons"
                    }
                }
            }
        }
    }
}
publishShadowPublicationToMavenLocal.mustRunAfter shadowJar
